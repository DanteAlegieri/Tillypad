<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Гастродом №3{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
    <div>
        <div class="brand">ГАСТРОДОМ №3</div>
        <div class="subtitle">Tillypad Dashboard v0.2</div>
    </div>
    <nav>
        <a href="/">Дашборд</a>
        <a href="/diagnostics">Диагностика API</a>
    </nav>
</header>

<main class="container">
    {% if message %}
        <div class="alert success">{{ message }}</div>
    {% endif %}
    {% if error %}
        <div class="alert error">{{ error }}</div>
    {% endif %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
